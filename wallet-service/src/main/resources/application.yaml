spring:
  application:
    name: HermesWallet

  datasource:
    url: jdbc:postgresql://localhost:5432/hermes_wallet_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}

server:
  port: ${SERVER_PORT:8083}

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
