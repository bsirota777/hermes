apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: hermes
data:
  init-dbs.sh: |
    #!/bin/bash
    set -e
    for db in user_service_db delivery_service_db profile_service_db wallet_service_db; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1 || \
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -c "CREATE DATABASE $db;"
    done
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: hermes
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate   # single PVC, avoid two pods fighting over it
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              value: hermes
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: hermes-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              value: postgres
          resources: # <-- add this block
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata   # subPath so the init script dir below doesn't collide with lost+found on a fresh volume
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "hermes"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - name: init-script
          configMap: { name: postgres-init, defaultMode: 0755 }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hermes
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
