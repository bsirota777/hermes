# Local cluster for trying this out. Maps host port 8000 -> the Kong proxy
# NodePort so you can hit http://localhost:8000 like you would a real gateway.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        protocol: TCP
