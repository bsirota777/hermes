# Only user-service and delivery-service are called directly by the frontend
# (profile-service and wallet-service are internal, service-to-service only -
# see hermes-frontend's api/client.js, which only ever points at these two).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-ingress
  namespace: hermes
  annotations:
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /(login|register|users).*
            pathType: ImplementationSpecific
            backend:
              service: { name: user-service, port: { number: 8081 } }
          - path: /(deliveries|admin/deliveries).*
            pathType: ImplementationSpecific
            backend:
              service: { name: delivery-service, port: { number: 8084 } }
          - path: /admin/users.*
            pathType: ImplementationSpecific
            backend:
              service: { name: user-service, port: { number: 8081 } }
