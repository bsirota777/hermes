spring:
  application:
    name: HermesUser

  datasource:
    url: jdbc:postgresql://localhost:5432/hermes_user_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health

admin:
  seed:
    email: ${ADMIN_SEED_EMAIL:admin@hermes.local}
    password: ${ADMIN_SEED_PASSWORD:}

flyway:
  enabled: true
  locations: classpath:db/migration/user

#FUTURE JWT config — since User Service is the one issuing tokens (JwtService), whatever property it reads for the signing secret/expiry needs to live here. If it's currently just an env var read directly in code, fine