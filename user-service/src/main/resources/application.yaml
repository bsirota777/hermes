spring:
  application:
    name: HermesUser

  datasource:
    url: jdbc:postgresql://localhost:5432/hermes_user_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: ${SERVER_PORT:8081}

profile-service:
  base-url: ${PROFILE_SERVICE_BASE_URL:http://profile-service:8082}

delivery-service:
  base-url: ${DELIVERY_SERVICE_BASE_URL:http://delivery-service:8084}
