name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan to catch newly-disclosed CVEs even with no code changes
    - cron: '0 3 * * 1'

jobs:
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      # Builds every module (common + all 4 services) in one pass - CodeQL
      # analyzes the whole multi-module build together, so this doesn't need
      # to be matrixed the way the image-based jobs below do.
      - name: Build (no tests, just compile for CodeQL to analyze)
        run: ./gradlew build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  snyk-dependencies:
    name: Snyk - Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Scans the whole Gradle dependency graph (all subprojects) in one pass.
      - name: Run Snyk to check for vulnerable dependencies
        uses: snyk/actions/gradle@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-sub-projects --policy-path=.snyk

  build-image:
    name: Build image for scanning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, delivery-service, profile-service, wallet-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: hermes-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Save image as artifact
        run: docker save hermes-${{ matrix.service }}:${{ github.sha }} -o /tmp/hermes-${{ matrix.service }}-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.service }}-image
          path: /tmp/hermes-${{ matrix.service }}-image.tar
          retention-days: 1

  snyk-container:
    name: Snyk - Container Scan
    runs-on: ubuntu-latest
    needs: build-image
    strategy:
      matrix:
        service: [user-service, delivery-service, profile-service, wallet-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-${{ matrix.service }}-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/hermes-${{ matrix.service }}-image.tar

      - name: Run Snyk to check the Docker image
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: hermes-${{ matrix.service }}:${{ github.sha }}
          args: --severity-threshold=high --file=${{ matrix.service }}/Dockerfile --policy-path=.snyk

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: build-image
    strategy:
      matrix:
        include:
          - service: user-service
            port: 8081
            db_name: hermes_user_db
          - service: delivery-service
            port: 8084
            db_name: hermes_delivery_db
          - service: profile-service
            port: 8082
            db_name: hermes_profile_db
          - service: wallet-service
            port: 8083
            db_name: hermes_wallet_db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-${{ matrix.service }}-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/hermes-${{ matrix.service }}-image.tar

      - name: Log in to Docker Hub
        # Avoids Docker Hub anonymous pull rate limits when the Postgres
        # service image is pulled here, same fix as the main pipeline
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start Postgres
        run: |
          docker run -d --name hermes-db \
            -e POSTGRES_DB=${{ matrix.db_name }} \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:16-alpine

      # Every possible property placeholder is passed unconditionally to every
      # service - a service that doesn't reference a given one (e.g. STRIPE_SECRET_KEY
      # for user-service) just ignores it, which keeps this step identical across the matrix.
      - name: Start ${{ matrix.service }}
        run: |
          docker run -d --name hermes-app \
            --network host \
            -e SPRING_PROFILES_ACTIVE=ci \
            -e SERVER_PORT=${{ matrix.port }} \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/${{ matrix.db_name }} \
            -e JWT_SECRET=vTjn89nwZ1y4e1j9w9EgvYynGxHYY9EcvY//zXVsqkU= \
            -e STRIPE_SECRET_KEY=sk_test_placeholder \
            -e GOOGLE_MAPS_API_KEY=placeholder \
            -e NOMINATIM_USER_AGENT=hermes-ci-scan \
            -e USER_SERVICE_BASE_URL=http://localhost:8081 \
            -e PROFILE_SERVICE_BASE_URL=http://localhost:8082 \
            -e WALLET_SERVICE_BASE_URL=http://localhost:8083 \
            hermes-${{ matrix.service }}:${{ github.sha }}

      - name: Wait for ${{ matrix.service }} to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:${{ matrix.port }}/actuator/health; then
              echo "${{ matrix.service }} is up"
              exit 0
            fi
            echo "Waiting for ${{ matrix.service }}..."
            sleep 3
          done
          echo "${{ matrix.service }} did not become healthy in time"
          docker logs hermes-app
          exit 1

      - name: ZAP Baseline Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:${{ matrix.port }}'
          cmd_options: '-a'
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.service }}-zap-report
          path: |
            report_json.json
            report_md.md
            report_html.html
          if-no-files-found: warn

      - name: Stop containers
        if: always()
        run: |
          docker stop hermes-app hermes-db || true
          docker rm hermes-app hermes-db || true
