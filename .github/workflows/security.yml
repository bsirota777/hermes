name: Security Scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan to catch newly-disclosed CVEs even with no code changes
    - cron: '0 3 * * 1'

jobs:
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      # Builds every module (common + all 4 services) in one pass - CodeQL
      # analyzes the whole multi-module build together, so this doesn't need
      # to be matrixed the way the image-based jobs below do.
      - name: Build (no tests, just compile for CodeQL to analyze)
        run: ./gradlew build -x test

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  snyk-dependencies:
    name: Snyk - Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Scans the whole Gradle dependency graph (all subprojects) in one pass.
      - name: Run Snyk to check for vulnerable dependencies
        uses: snyk/actions/gradle@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-sub-projects

  build-image:
    name: Build image for scanning
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, delivery-service, profile-service, wallet-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: hermes-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Save image as artifact
        run: docker save hermes-${{ matrix.service }}:${{ github.sha }} -o /tmp/hermes-${{ matrix.service }}-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.service }}-image
          path: /tmp/hermes-${{ matrix.service }}-image.tar
          retention-days: 1

  snyk-container:
    name: Snyk - Container Scan
    runs-on: ubuntu-latest
    needs: build-image
    strategy:
      matrix:
        service: [user-service, delivery-service, profile-service, wallet-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-${{ matrix.service }}-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/hermes-${{ matrix.service }}-image.tar

      - name: Run Snyk to check the Docker image
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: hermes-${{ matrix.service }}:${{ github.sha }}
          args: --severity-threshold=high --file=${{ matrix.service }}/Dockerfile

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: build-image

    strategy:
      matrix:
        include:
          - service: user-service
            port: 8081

          - service: profile-service
            port: 8082

          - service: wallet-service
            port: 8083

          - service: delivery-service
            port: 8084

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Download all four service images
      # ------------------------------------------------------------
      - name: Download user-service image
        uses: actions/download-artifact@v4
        with:
          name: hermes-user-service-image
          path: /tmp/user-service

      - name: Download profile-service image
        uses: actions/download-artifact@v4
        with:
          name: hermes-profile-service-image
          path: /tmp/profile-service

      - name: Download wallet-service image
        uses: actions/download-artifact@v4
        with:
          name: hermes-wallet-service-image
          path: /tmp/wallet-service

      - name: Download delivery-service image
        uses: actions/download-artifact@v4
        with:
          name: hermes-delivery-service-image
          path: /tmp/delivery-service

      # ------------------------------------------------------------
      # Load all four images
      # ------------------------------------------------------------
      - name: Load Docker images
        run: |
          docker load -i /tmp/user-service/hermes-user-service-image.tar
          docker load -i /tmp/profile-service/hermes-profile-service-image.tar
          docker load -i /tmp/wallet-service/hermes-wallet-service-image.tar
          docker load -i /tmp/delivery-service/hermes-delivery-service-image.tar

      # ------------------------------------------------------------
      # Docker Hub login
      # ------------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------------
      # Generate temporary CI credentials
      #
      # These are NOT GitHub secrets and are never persisted.
      # ------------------------------------------------------------
      - name: Generate CI credentials
        id: ci-secrets
        shell: bash
        run: |
          {
            echo "user_db_password=$(openssl rand -hex 32)"
            echo "profile_db_password=$(openssl rand -hex 32)"
            echo "wallet_db_password=$(openssl rand -hex 32)"
            echo "delivery_db_password=$(openssl rand -hex 32)"
            echo "jwt_secret=$(openssl rand -base64 32)"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Create isolated Docker network
      # ------------------------------------------------------------
      - name: Create CI network
        run: docker network create hermes-ci

      # ------------------------------------------------------------
      # Start four independent PostgreSQL databases
      # ------------------------------------------------------------
      - name: Start user database
        run: |
          docker run -d \
            --name user-db \
            --network hermes-ci \
            -e POSTGRES_DB=hermes_user_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD="${{ steps.ci-secrets.outputs.user_db_password }}" \
            postgres:16-alpine

      - name: Start profile database
        run: |
          docker run -d \
            --name profile-db \
            --network hermes-ci \
            -e POSTGRES_DB=hermes_profile_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD="${{ steps.ci-secrets.outputs.profile_db_password }}" \
            postgres:16-alpine

      - name: Start wallet database
        run: |
          docker run -d \
            --name wallet-db \
            --network hermes-ci \
            -e POSTGRES_DB=hermes_wallet_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD="${{ steps.ci-secrets.outputs.wallet_db_password }}" \
            postgres:16-alpine

      - name: Start delivery database
        run: |
          docker run -d \
            --name delivery-db \
            --network hermes-ci \
            -e POSTGRES_DB=hermes_delivery_db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD="${{ steps.ci-secrets.outputs.delivery_db_password }}" \
            postgres:16-alpine

      # ------------------------------------------------------------
      # Wait for databases
      # ------------------------------------------------------------
      - name: Wait for databases
        shell: bash
        run: |
          for db in user-db profile-db wallet-db delivery-db; do
            echo "Waiting for $db..."

            for i in $(seq 1 30); do
              if docker exec "$db" pg_isready -U postgres >/dev/null 2>&1; then
                echo "$db is ready"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "$db failed to become ready"
                docker logs "$db"
                exit 1
              fi

              sleep 2
            done
          done

      # ------------------------------------------------------------
      # Start user-service
      # ------------------------------------------------------------
      - name: Start user-service
        run: |
          docker run -d \
            --name user-service \
            --network hermes-ci \
            -p 8081:8081 \
            -e SPRING_PROFILES_ACTIVE=ci \
            -e SERVER_PORT=8081 \
            -e DB_USER=postgres \
            -e DB_PASSWORD="${{ steps.ci-secrets.outputs.user_db_password }}" \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://user-db:5432/hermes_user_db \
            -e JWT_SECRET="${{ steps.ci-secrets.outputs.jwt_secret }}" \
            -e PROFILE_SERVICE_BASE_URL=http://profile-service:8082 \
            "hermes-user-service:${{ github.sha }}"

      # ------------------------------------------------------------
      # Start profile-service
      # ------------------------------------------------------------
      - name: Start profile-service
        run: |
          docker run -d \
            --name profile-service \
            --network hermes-ci \
            -p 8082:8082 \
            -e SPRING_PROFILES_ACTIVE=ci \
            -e SERVER_PORT=8082 \
            -e DB_USER=postgres \
            -e DB_PASSWORD="${{ steps.ci-secrets.outputs.profile_db_password }}" \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://profile-db:5432/hermes_profile_db \
            -e JWT_SECRET="${{ steps.ci-secrets.outputs.jwt_secret }}" \
            -e USER_SERVICE_BASE_URL=http://user-service:8081 \
            -e NOMINATIM_USER_AGENT="${{ secrets.NOMINATIM_USER_AGENT }}" \
            "hermes-profile-service:${{ github.sha }}"

      # ------------------------------------------------------------
      # Start wallet-service
      # ------------------------------------------------------------
      - name: Start wallet-service
        run: |
          docker run -d \
            --name wallet-service \
            --network hermes-ci \
            -p 8083:8083 \
            -e SPRING_PROFILES_ACTIVE=ci \
            -e SERVER_PORT=8083 \
            -e DB_USER=postgres \
            -e DB_PASSWORD="${{ steps.ci-secrets.outputs.wallet_db_password }}" \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://wallet-db:5432/hermes_wallet_db \
            -e JWT_SECRET="${{ steps.ci-secrets.outputs.jwt_secret }}" \
            -e STRIPE_SECRET_KEY=sk_test_placeholder \
            "hermes-wallet-service:${{ github.sha }}"

      # ------------------------------------------------------------
      # Start delivery-service
      # ------------------------------------------------------------
      - name: Start delivery-service
        run: |
          docker run -d \
            --name delivery-service \
            --network hermes-ci \
            -p 8084:8084 \
            -e SPRING_PROFILES_ACTIVE=ci \
            -e SERVER_PORT=8084 \
            -e DB_USER=postgres \
            -e DB_PASSWORD="${{ steps.ci-secrets.outputs.delivery_db_password }}" \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://delivery-db:5432/hermes_delivery_db \
            -e JWT_SECRET="${{ steps.ci-secrets.outputs.jwt_secret }}" \
            -e STRIPE_SECRET_KEY=sk_test_placeholder \
            -e GOOGLE_MAPS_API_KEY=placeholder \
            -e NOMINATIM_USER_AGENT="${{ secrets.NOMINATIM_USER_AGENT }}" \
            -e USER_SERVICE_BASE_URL=http://user-service:8081 \
            -e PROFILE_SERVICE_BASE_URL=http://profile-service:8082 \
            -e WALLET_SERVICE_BASE_URL=http://wallet-service:8083 \
            "hermes-delivery-service:${{ github.sha }}"

      # ------------------------------------------------------------
      # Wait for all services
      # ------------------------------------------------------------
      - name: Wait for services
        shell: bash
        run: |
          declare -A services=(
            [user-service]=8081
            [profile-service]=8082
            [wallet-service]=8083
            [delivery-service]=8084
          )

          for service in "${!services[@]}"; do
            port="${services[$service]}"

            echo "Waiting for $service on port $port..."

            for i in $(seq 1 60); do
              if curl -sf "http://localhost:${port}/actuator/health" >/dev/null; then
                echo "$service is healthy"
                break
              fi

              if [ "$i" -eq 60 ]; then
                echo "$service failed to become healthy"
                docker logs "$service"
                exit 1
              fi

              sleep 3
            done
          done

      # ------------------------------------------------------------
      # Run ZAP only against the matrix target
      # ------------------------------------------------------------
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: "http://localhost:${{ matrix.port }}"
          cmd_options: "-a"
          fail_action: false
          allow_issue_writing: false

      # ------------------------------------------------------------
      # Preserve reports
      # ------------------------------------------------------------
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.service }}-zap-report
          path: |
            report_json.json
            report_md.md
            report_html.html
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Diagnostics
      # ------------------------------------------------------------
      - name: Show service logs on failure
        if: failure()
        run: |
          for service in user-service profile-service wallet-service delivery-service; do
            echo "================================================"
            echo "LOGS: $service"
            echo "================================================"
            docker logs "$service" || true
          done

      # ------------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------------
      - name: Stop containers
        if: always()
        run: |
          docker rm -f \
            user-service \
            profile-service \
            wallet-service \
            delivery-service \
            user-db \
            profile-db \
            wallet-db \
            delivery-db \
            || true

          docker network rm hermes-ci || true